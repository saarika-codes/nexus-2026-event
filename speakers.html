<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speakers — NEXUS 2026</title>
  <meta name="description" content="Meet the NEXUS 2026 speakers: pioneers in AI, climate tech, bioethics, space and tech policy." />
  <meta name="theme-color" content="#0B0D0E" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="speakers">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-hero">
      <div class="container text-center">
        <span class="section-tag">Confirmed Voices</span>
        <h1 class="section-title">The Speakers</h1>
        <p class="section-sub">Pioneers, dissidents, builders, and dreamers — handpicked for one thing: they have something real to say.</p>
      </div>
    </header>

    <section class="section-speakers">
      <div class="container">
        <div class="speaker-toolbar">
          <label class="visually-hidden" for="speakerSearch">Search speakers or topics</label>
          <div class="search-wrap">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="speakerSearch" class="form-control" type="search" placeholder="Search speakers or topics..." autocomplete="off" />
          </div>
          <p id="speakerCount" class="result-count" aria-live="polite"></p>
        </div>

        <div class="row g-4 justify-content-center" id="speakerGrid"></div>

        <div id="speakerEmpty" class="empty-state" hidden>
          <i class="bi bi-person-x" aria-hidden="true"></i>
          <p>No speakers match your search.</p>
          <button type="button" class="btn-outline-accent" id="speakerClear">Clear search</button>
        </div>

        <div class="text-center mt-5">
          <a href="schedule.html" class="btn-accent">See the agenda</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
