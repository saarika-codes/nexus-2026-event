<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda — NEXUS 2026</title>
  <meta name="description" content="The full three-day NEXUS 2026 agenda. Filter by session type, save sessions and add them to your calendar." />
  <meta name="theme-color" content="#0B0D0E" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="schedule">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-hero">
      <div class="container text-center">
        <span class="section-tag">Full Programme</span>
        <h1 class="section-title">The Agenda</h1>
        <p class="section-sub">Three days of dense, deliberately programmed conversations with zero filler.</p>
      </div>
    </header>

    <section class="section-schedule" style="padding-top:3.5rem">
      <div class="container">
        <div class="schedule-tabs" id="dayTabs" role="tablist" aria-label="Conference days"></div>

        <div class="schedule-toolbar">
          <div class="chip-row" id="typeFilters" role="group" aria-label="Filter sessions by type"></div>
          <button type="button" class="btn-outline-accent" id="exportSaved"><i class="bi bi-calendar-plus"></i> Export saved (.ics)</button>
        </div>

        <div class="schedule-list" id="scheduleList" role="tabpanel"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
